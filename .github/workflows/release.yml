# Deliberately manual and artifact-only. Publishing is a separate reviewed step.
name: Blood Echoes Mac preview
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Preview version (no leading v); nothing is published'
        required: true
        default: '0.1.0'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Rosetta and build dependencies
        run: |
          /usr/bin/arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license
          bash tools/macos/setup_deps.sh
          BB_ARCH=arm64 bash tools/macos/setup_deps.sh
          brew install python@3.11
      - name: Build and test
        run: |
          bash tools/macos/build.sh
          bash tools/macos/build_m2_native.command
          swift test --package-path launcher-macos
          python3 -m unittest discover -s tests -p 'test_optimized_launcher.py'
      - name: Package
        env:
          PREVIEW_VERSION: ${{ inputs.version }}
        run: bash tools/macos/package.sh "$PREVIEW_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: blood-echoes-mac-preview
          path: dist/*
          if-no-files-found: error
